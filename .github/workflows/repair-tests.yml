name: Repair branch tests

on:
  push:
    branches:
      - "repair/**"
  pull_request:
    branches:
      - "release-v0.60"
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip lupa capstone
      - name: Run targeted repair regressions
        run: python -m unittest tests.test_v060.ShuffleOffReturnTests tests.test_v060.ShuffleOnReturnTests tests.test_v1030.SimulatorTests tests.test_repair_v061 tests.test_round45
      - name: Package DEV4 development kit
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          source = Path("mod/RiftApartRandomizer")
          output = Path("dist/Rift_Apart_Randomizer_v0.61-DEV4_Kit_10.0.24.zip")
          output.parent.mkdir(parents=True, exist_ok=True)
          root = Path("Ratchet_Rift_Apart_Randomizer_v0.61-DEV4_Kit")
          with ZipFile(output, "w", ZIP_DEFLATED) as archive:
              for path in sorted(source.rglob("*")):
                  if path.is_file():
                      archive.write(path, root / path.relative_to(source))
          print(f"Packaged {output} ({output.stat().st_size} bytes)")
          PY
      - name: Upload DEV4 development kit
        uses: actions/upload-artifact@v4
        with:
          name: Rift-Apart-Randomizer-v0.61-DEV4-Development-Kit
          path: dist/Rift_Apart_Randomizer_v0.61-DEV4_Kit_10.0.24.zip
          if-no-files-found: error
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repair-branch-test-results
          path: TEST_RESULTS.txt
          if-no-files-found: ignore
