name: Repair branch tests

on:
  push:
    branches:
      - "repair/**"
      - "fix/**"
  pull_request:
    branches:
      - "release-v0.60"
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip lupa capstone
      - name: Run targeted repair regressions
        run: python -m unittest tests.test_v060.ShuffleOffReturnTests tests.test_v060.ShuffleOnReturnTests tests.test_v1030.SimulatorTests tests.test_repair_v061 tests.test_round45
      - name: Build and validate v0.62 DEV4 kit
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os, re, shutil
          from pathlib import Path

          source = Path("mod/RiftApartRandomizer")
          output = Path("dist/Ratchet_Rift_Apart_Randomizer_v0.62-DEV4_Kit")
          scripts = source / "scripts"
          expected = "10.0.24"
          runtime = (scripts / "10_rando_runtime.lua").read_text()
          settings = (scripts / "04_rando_settings.lua").read_text()
          if f'R.KIT_VERSION = "{expected}"' not in runtime:
              raise SystemExit("runtime kit version does not match expected 10.0.24")
          tags = {}
          for path in sorted(scripts.glob("*.lua")):
              match = re.search(r'RANDO_FILES\\["[^"]+"\\]\\s*=\\s*"([^"]+)"', path.read_text())
              if match:
                  tags[path.name] = match.group(1)
          bad = {name: version for name, version in tags.items() if version != expected}
          if bad or not tags:
              raise SystemExit(f"script version mismatch: {bad or 'no version tags found'}")
          if not re.search(r"boss_randomizer\\s*=\\s*false", settings):
              raise SystemExit("DEV4 package must default the Boss Randomizer OFF")
          if "chaos_randomizer = false" not in settings:
              raise SystemExit("Chaos Randomizer must remain OFF")
          if output.exists():
              shutil.rmtree(output)
          shutil.copytree(source, output)
          (output / "VERSION.txt").write_text(
              "Ratchet & Clank: Rift Apart Randomizer v0.62-DEV4\\n"
              "Kit version: 10.0.24\\n"
              f"Source commit: {os.environ['SOURCE_SHA']}\\n"
              "Development kit only; not a public release.\\n",
              encoding="utf-8")
          print(f"Validated {len(tags)} version-tagged scripts; packaged {output}")
          PY
      - name: Upload v0.62 DEV4 development kit (single extraction)
        uses: actions/upload-artifact@v4
        with:
          name: Ratchet-Rift-Apart-Randomizer-v0.62-DEV4-Kit
          path: dist/Ratchet_Rift_Apart_Randomizer_v0.62-DEV4_Kit/
          if-no-files-found: error
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repair-branch-test-results
          path: TEST_RESULTS.txt
          if-no-files-found: ignore
