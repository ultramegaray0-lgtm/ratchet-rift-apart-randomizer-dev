name: Repair branch tests

on:
  push:
    branches:
      - "repair/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip lupa capstone
      - name: Run test suite
        run: python run_tests.py
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repair-branch-test-results
          path: TEST_RESULTS.txt
          if-no-files-found: ignore
