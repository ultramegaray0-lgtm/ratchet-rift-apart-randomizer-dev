name: Stage all-planet builder and V4 validation

on:
  push:
    branches:
      - work/100-percent-enemy-replacement
      - work/global-runtime-enemy-registry
      - work/v4-total-enemy-coverage
    paths:
      - 'dev/v076dev4_stage_allgame/**'
      - '.github/workflows/stage-allgame-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Lua test dependency
        run: python -m pip install --upgrade pip lupa
      - name: Compile Python sources
        run: python -m compileall -q dev/v076dev4_stage_allgame/tools/stage_enemies
      - name: Compile global hook patch script
        run: python -m py_compile tools/global_registry/patch_rivet_hook.py
      - name: Run global registry source, callback, budget, runtime-path, and Lua syntax tests
        run: python -I dev/v076dev4_stage_allgame/tests/test_global_asset_manifest.py
      - name: Check builder CLI
        working-directory: dev/v076dev4_stage_allgame/tools/stage_enemies
        run: python -I stage_allgame.py --help
      - name: Test V3 stage log checker (factory and node Template adapters)
        run: python -I dev/v076dev4_stage_allgame/tests/test_stage_check_log.py
      - name: Run Lua scale regression tests
        run: python -I dev/v076dev4_stage_allgame/tests/test_stage_lua_scale.py dev/v076dev4_stage_allgame/scripts
      - name: Report real-zone test requirement
        run: python -I dev/v076dev4_stage_allgame/tools/stage_enemies/test_stage_allgame.py
      - name: Package tested V4 source snapshot
        if: success()
        shell: bash
        run: |
          mkdir -p dist
          cat > dist/V4_TEST_BUILD_INFO.txt <<EOF
          Rift Apart Enemy Randomizer - V4 test snapshot
          Commit: ${GITHUB_SHA}
          Branch: ${GITHUB_REF_NAME}
          Validation workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          This is the source/build kit, not a prebuilt game-specific .stage.
          Build the .stage against your own installed game folder using BUILD_V4_TOTAL_COVERAGE.bat.
          Back up the game/mod files before installing. Keep the native Rivet Hook DLL package separate.
          EOF
          zip -qr dist/RiftApart_EnemyRandomizer_V4_TestBuild.zip . \
            -x '.git/*' 'dist/*' '**/__pycache__/*' '*.pyc' \
               'builds/*' '**/builds/*' 'incoming/*' '**/incoming/*' \
               '*.stage' '**/*.stage' 'rando_stage_backup/*' '**/rando_stage_backup/*'
      - name: Upload tested V4 source ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RiftApart-EnemyRandomizer-V4-TestBuild
          path: dist/RiftApart_EnemyRandomizer_V4_TestBuild.zip
          if-no-files-found: error
          retention-days: 30
