name: Temporary incoming archive extraction
on:
  push:
    branches:
      - work/100-percent-enemy-replacement
    paths:
      - 'incoming/*.zip'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Extract incoming ZIP into staging
        run: |
          mkdir -p incoming/unpacked
          python - <<'PY'
          import zipfile
          from pathlib import Path
          zpath = Path("incoming/RandoEnemies_POC_v0.76-DEV4.zip")
          with zipfile.ZipFile(zpath) as z:
              root = "RandoEnemies_POC_v0.76-DEV4/"
              for info in z.infolist():
                  if info.is_dir() or not info.filename.startswith(root):
                      continue
                  rel = info.filename[len(root):]
                  if not rel or ".." in Path(rel).parts:
                      raise SystemExit(f"Unsafe archive path: {info.filename}")
                  target = Path("incoming/unpacked") / rel
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(info))
          PY
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add incoming/unpacked
          git commit -m "Extract incoming enemy randomizer archive" || exit 0
          git push
